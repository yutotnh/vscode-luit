name: "Format"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  # prettier は純粋な Node.js プロセスで、OS 差は改行コードだけ。それも
  # .gitattributes の `* text=auto eol=lf` で固定してあるため、複数 OS で
  # 回しても得られる信号が無い。
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ./.nvmrc
      - run: npm install
      - name: format check
        run: npm run format-check
